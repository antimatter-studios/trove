[package]
name = "trove-desktop"
version = "0.14.0"
description = "Trove — a desktop vault manager"
authors = ["Chris Thomas"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name; without it
# the two collide on Windows (rust-lang/cargo#8519).
name = "trove_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Server-side password-strength scoring for the entry list (the DTO carries a
# 0..=100 score, never the password itself).
zxcvbn = "3"

# In the monorepo the GUI links trove-core directly from the workspace source,
# so a core change is picked up without a crates.io publish + version bump. The
# crate is still published to crates.io for external consumers; only the app,
# the CLI and the daemon consume it by path.
trove-core = { path = "../../crates/trove-core" }
# The GUI is troved in desktop form: it does the same work on unlock (export
# keys into the system agent, materialize files) and on lock (withdraw, wipe),
# so it links the daemon's library for that logic rather than reimplementing
# it. Same arrangement trove-cli already uses; it pulls in tokio, which Tauri
# is running anyway.
troved = { path = "../../crates/troved" }

# Argon2 is deliberately CPU-heavy, and unoptimised it is ~10x slower still: a
# debug build took 11.4s to open a vault the release CLI opens in ~1.5s. That
# is a dev-experience trap, not a vault problem — so optimise the crates that
# actually do the KDF work.
#
# Deliberately NOT `package."*"`: optimising every dependency cost minutes on
# each rebuild (and `troved` is a path dep, so editing it rebuilt the lot),
# which traded a slow unlock for a slow edit-run loop. Only these three are on
# the hot path.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.trove-core]
opt-level = 3

[profile.dev.package.troved]
opt-level = 3

# macOS only: Touch ID (LocalAuthentication) plus the login keychain that holds
# the password it gates. `LAContext` needs no entitlement — verified from an
# unsigned binary — so the prompt works without a provisioning profile.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2 = "0.6"
block2 = "0.6"
security-framework = "3"
