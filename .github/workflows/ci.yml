# trove CI
#
# Triggers on push / pull_request against `main` and on manual dispatch.
# Jobs:
#   - Test (ubuntu-latest, macos-latest): cargo test --workspace --locked
#   - Clippy (ubuntu-latest):              cargo clippy ... -- -D warnings (--no-deps)
#   - Fmt (ubuntu-latest):                 cargo fmt --all -- --check
#   - Semver (ubuntu-latest):              cargo semver-checks on trove-core
#   - Fuzz lockfile (ubuntu-latest):       crates/troved/fuzz/Cargo.lock resolves --locked
#   - Deny (ubuntu-latest):                cargo deny: licences, bans, sources
#   - Audit (ubuntu-latest):               cargo audit (advisory check)
#
# Notes:
#   * `--locked` everywhere so a stale Cargo.lock fails CI.
#   * `--no-deps` on clippy to skip pre-existing warnings in third-party crates.
#   * Audit ignores RUSTSEC-2023-0071 (Marvin attack on `rsa` 0.9.x) because
#     trove only uses `rsa` for SSH-agent signing, not decryption — see the
#     audit step's inline comment for the full rationale.
#   * No MSRV job: trove is a binary application, not a library, so MSRV
#     (which exists for library consumers to pick a version) doesn't apply.
#     Build policy is "current stable Rust"; the Test jobs verify that.
#     Transitive deps adopting Edition 2024 was making the MSRV floor
#     ratchet on every dep update with no real benefit.
#   * No auto-fmt: if the tree isn't fmt-clean we want the job to fail loudly
#     rather than mutate code in CI. Run the `fmt-fix` workflow manually to fix.
#   * No deploy / coverage jobs by design (out of scope).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1
  # GitHub runners intermittently fail cargo downloads with
  # "[16] Error in the HTTP2 framing layer" (a curl 8.x + crates.io CDN issue).
  # Disable HTTP/2 multiplexing to dodge the framing bug, and retry transient
  # network failures so one bad download doesn't fail the job. Applies to every
  # job (Test/Clippy/Build/Audit all hit the network).
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install system tools (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnupg \
            git \
            openssh-client \
            keepassxc
        # macOS GitHub runners ship with gpg, git, ssh-keygen, ssh-add already.

      # keepassxc-cli is the mandatory third-party oracle for the cross-tool
      # conformance + interop tests — they hard-fail (never skip) if it's
      # absent. Ubuntu gets it from apt above; macOS from the cask (the CLI
      # lives inside the .app bundle, which the test harness's discovery checks).
      - name: Install keepassxc-cli (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install --cask keepassxc

      - name: Verify required system tools
        run: |
          set -eux
          command -v gpg
          command -v git
          command -v ssh-keygen
          command -v ssh-add
          if [ "$RUNNER_OS" = "macOS" ]; then
            "/Applications/KeePassXC.app/Contents/MacOS/keepassxc-cli" --version
          else
            keepassxc-cli --version
          fi

      - name: Cargo cache
        uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.3
        with:
          # Include OS + Cargo.lock hash so each runner gets its own cache slot.
          key: ${{ matrix.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          shared-key: test

      - name: cargo test
        env:
          TROVE_REQUIRE_KEEPASSXC: "1"
        run: cargo test --workspace --locked

      - name: Conformance matrix (keepass-spec-tests)
        # This harness is a SEPARATE workspace (own Cargo.lock, kept out of the
        # app's audited graph). `--workspace` above doesn't reach it, so run it
        # by manifest. It drives the trove CLI as a subprocess, so build that
        # binary into the repo-root target dir and point TROVE_BIN at it.
        run: |
          cargo build --locked -p trove-cli
          TROVE_BIN="$PWD/target/debug/trove" \
            cargo test --manifest-path crates/keepass-spec-tests/Cargo.toml --locked

      # Challenge-response (--features yubikey) is Linux-only for now: the
      # keepass crate pins challenge_response's nusb backend, whose device
      # enumeration doesn't compile on macOS (nusb busnum is Linux-only).
      # The software LocalChallenge provider exercises the full derivation
      # without hardware; the real-device test stays #[ignore]d.
      - name: cargo test (yubikey feature, software provider)
        if: runner.os == 'Linux'
        run: |
          cargo test -p trove-core --features yubikey --locked
          cargo check -p trove-cli --features yubikey --locked

  # Windows is supported by compiling to native named-pipe IPC. We build the
  # shipping binaries (not the test suite — some integration-test helpers are
  # Unix-socket specific) so a regression in the cross-platform `ipc` layer
  # fails CI here rather than only on a release tag.
  build-windows:
    name: Build (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.3
        with:
          key: windows-build-${{ hashFiles('**/Cargo.lock') }}
          shared-key: windows

      - name: cargo build (trove + troved)
        run: cargo build --locked -p trove-cli -p troved

      - name: Test owner-only named-pipe ACL
        run: cargo test --locked -p troved --lib ipc::windows_imp::security::tests::pipe_owner_can_connect_to_owner_only_pipe

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.3
        with:
          key: ubuntu-latest-clippy-${{ hashFiles('**/Cargo.lock') }}
          shared-key: clippy

      - name: cargo clippy
        # --no-deps skips the vendored keepass crate's pre-existing warnings.
        run: cargo clippy --workspace --all-targets --locked --no-deps -- -D warnings

  fmt:
    name: Fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable + rustfmt)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        # Check-only; do not auto-format. If this fails, run the fmt-fix
        # workflow (manual dispatch) or `cargo fmt --all` locally.
        run: cargo fmt --all -- --check

  fuzz-lock:
    name: Fuzz lockfile
    runs-on: ubuntu-latest
    # crates/troved/fuzz is its own workspace with its own Cargo.lock, which
    # nothing else builds on a PR. The nightly fuzz run fetches with --locked,
    # so a version bump or a troved dependency change that skips this lock
    # breaks fuzzing that night. Resolve it --locked here instead.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fuzz crate's Cargo.lock is current
        run: |
          cargo metadata --locked --format-version 1 \
            --manifest-path crates/troved/fuzz/Cargo.toml > /dev/null \
            || { echo "::error::crates/troved/fuzz/Cargo.lock is stale; run: cargo update --manifest-path crates/troved/fuzz/Cargo.toml --workspace, and commit it"; exit 1; }

  deny:
    name: Deny (${{ matrix.graph }})
    runs-on: ubuntu-latest
    # Licences, bans and sources per deny.toml. Advisories stay with the
    # Audit job. The desktop crate has its own lockfile, so it's checked
    # separately against the same policy.
    strategy:
      fail-fast: false
      matrix:
        include:
          - graph: workspace
            manifest: Cargo.toml
          - graph: desktop
            manifest: trove-desktop/src-tauri/Cargo.toml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.manifest }}
          command: check bans licenses sources
          arguments: --config deny.toml
          # The action image's own cargo predates multi-line inline tables
          # (troved's windows-sys dependency) and can't read the manifests.
          rust-version: stable

  semver:
    name: Semver (trove-core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline is a git revision, which has to be in the clone.
          fetch-depth: 0

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.3
        with:
          key: ubuntu-latest-semver-${{ hashFiles('**/Cargo.lock') }}
          shared-key: semver
          # Cache the cargo-semver-checks binary across runs.
          cache-all-crates: true

      - name: Install cargo-semver-checks
        run: |
          if ! command -v cargo-semver-checks >/dev/null 2>&1; then
            cargo install --locked cargo-semver-checks
          fi

      - name: cargo semver-checks
        # Each change is checked against the code it lands on: the PR's base,
        # or the previous main commit on a push. Checking against the last
        # crates.io release instead would fail every PR after a deliberate
        # break until the next release. A manual run checks against crates.io.
        #
        # A break has to be declared with `!` in the conventional-commit
        # header (the PR title, which becomes the squash commit), e.g.
        # `feat(core)!: ...`. Otherwise no break is allowed: `patch` before
        # 1.0, where cargo treats 0.y.z -> 0.y.(z+1) as compatible, and
        # `minor` from 1.0. Retitling a PR needs a new push to rerun this.
        #
        # Default features only: the tool builds the crate without our
        # Cargo.lock, and the `yubikey` feature's `challenge_response`
        # doesn't build against the newest `nusb`.
        env:
          HEADER: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          header=$(printf '%s\n' "$HEADER" | head -n1)
          version=$(cargo metadata --no-deps --format-version 1 --locked |
            jq -r '.packages[] | select(.name == "trove-core") | .version')
          if [[ "$header" =~ ^[a-z]+(\([^\)]*\))?!: ]]; then
            release=major
          elif [[ "$version" == 0.* ]]; then
            release=patch
          else
            release=minor
          fi
          baseline=()
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]]; then
            baseline=(--baseline-rev "$BASE")
          fi
          echo "release type: $release, baseline: ${BASE:-crates.io}"
          cargo semver-checks --package trove-core --default-features \
            --release-type "$release" "${baseline[@]}"

  audit:
    name: Audit
    runs-on: ubuntu-latest
    # Surfaced but non-blocking: the vendored keepass fork may carry advisories
    # we don't want to gate every PR on. Review failures manually.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.3
        with:
          key: ubuntu-latest-audit-${{ hashFiles('**/Cargo.lock') }}
          shared-key: audit
          # Cache the cargo-audit binary across runs.
          cache-all-crates: true

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install --locked cargo-audit
          fi

      - name: cargo audit
        # RUSTSEC-2023-0071 (Marvin Attack on `rsa` 0.9.x) is ignored: it's a
        # timing-sidechannel in RSA *decryption*, no upstream fix exists, and
        # the only paths in trove that touch `rsa` are SSH-agent signing
        # (different code path) and key parsing — not decryption. The threat
        # model also requires same-UID adversary, who can already ptrace the
        # daemon. Re-evaluate when an `rsa` 0.9.x patch ships.
        #
        # The `quick-xml` <0.41 DoS advisories (RUSTSEC-2026-0194/-0195) do NOT
        # appear here: the only crate pulling old quick-xml is the legacy
        # `keepass` producer in `keepass-spec-tests`, which is a separate
        # workspace (own Cargo.lock) and never enters this audited graph. Shipped
        # code is on `keepass` 0.13 / quick-xml 0.41.
        run: cargo audit --ignore RUSTSEC-2023-0071
